services:
  web:
    build:
      context: .
      dockerfile: dockerizer/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_IMAGE_BASE_URL: ${VITE_IMAGE_BASE_URL:-}
    ports:
      - "80:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      # Runtime: el entrypoint la escribe en maps-config.js. EasyPanel .env también sirve.
      VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
      VITE_IMAGE_BASE_URL: ${VITE_IMAGE_BASE_URL:-}
